spring.application.name=sprintcost-backend
spring.datasource.url=jdbc:h2:mem:sprintcost;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

prediction.model.python-executable=python3
prediction.model.predictor-script=scripts/predict_sprint_cost.py
prediction.model.artifacts-root=../Human-aware-sprint-codest-predict/artifacts/sprint_cost_forecasting
prediction.model.training-module-root=../Human-aware-sprint-codest-predict

# Enable detailed error messages for debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
